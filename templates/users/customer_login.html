{% extends 'base.html' %}
{% block title %}
  Customer Login
{% endblock %}

{% block content %}
    <div class="container mt-5 d-flex justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header text-center text-primary">
                    <h2>Customer Login</h2>
                </div>

                <div class="card-body">
                    <form method="POST" action="{% url 'customer_login' %}">
                        {% csrf_token %}
                        <div class="mb-3">
<!--                          {{ form.as_p}}-->
                            <label for="id_phone" class="form-label d-block">Phone:</label>
                            {{ form.phone}}
                        </div>

                        <div class="mb-3">
<!--                          {{ form.as_p}}-->
                            <label for="id_password" class="form-label d-block">Password:</label>
                            {{ form.password}}
                        </div>

                      <div class="text-center">
                          <button type="submit" class="btn btn-primary w-50">Login</button>
                      </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
