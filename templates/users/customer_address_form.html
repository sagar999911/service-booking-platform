{% extends 'base.html' %}
{% block title %}
    Add/Edit Address
{% endblock %}
{% block content %}
    <div class="container mt-5 d-flex justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header text-center text-primary">
                    <h2>Address Details</h2>
                </div>

                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_house_no" class="form-label d-block">House No.:</label>
                            {{ form.house_no }}
                        </div>
                        <div class="mb-3">
                            <label for="id_area" class="form-label d-block">Area:</label>
                            {{ form.area }}
                        </div>
                        <div class="mb-3">
                            <label for="id_pin_code" class="form-label d-block">Pin Code:</label>
                            {{ form.pin_code }}
                        </div>
                        <div class="mb-3">
                            <label for="id_landmark" class="form-label d-block">Landmark:</label>
                            {{ form.landmark }}
                        </div>
                        <div class="mb-3">
                            <label for="id_town_city" class="form-label d-block">Town/City:</label>
                            {{ form.town_city }}
                        </div>
                        <div class="mb-3">
                            <label for="id_state" class="form-label d-block">State:</label>
                            {{ form.state }}
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-success">Save Address</button>
                            <a href="{% url 'customer_address_list' %}" class="btn btn-secondary">Cancel</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
