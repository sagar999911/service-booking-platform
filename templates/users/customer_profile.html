{% extends 'base.html' %}
{% block title %}
    {{ user.phone }}
{% endblock %}

{% block content %}
    <div class="container mt-5 d-flex justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header text-center text-primary">
                    <h1>Your Profile</h1>
                </div>

                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label d-block">{{ form.full_name.label_tag }}</label>
                            {{ form.full_name }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label d-block">{{ form.email.label_tag }}</label>
                            {{ form.email }}
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-success w-50">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
